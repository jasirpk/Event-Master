name: event_master
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+2

environment:
  sdk: '>=3.4.1 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.6
  flutter_bloc: ^9.1.1
  get: ^4.6.6
  lottie: ^3.1.2
  pushable_button: ^0.0.4
  carousel_slider: ^5.1.2
  # Upper-bounded, and bumped from ^4.11.0, because firebase_remote_config
  # cannot be added without it: the oldest release, 6.5.5, declares
  # firebase_core ^4.12.1.
  #
  # The bound matters more than the bump. Every firebase_* plugin declares
  # `.package(url: firebase-ios-sdk, exact: firebaseSdkVersion)` in its
  # Package.swift, so the whole set must name the *same* firebase-ios-sdk or
  # Xcode cannot resolve the graph at all. 4.11.0 and 4.12.1 both pin
  # 12.15.0 — which is what firebase_auth 6.5.4, cloud_firestore 6.6.0 and
  # firebase_storage 13.4.3 locked here pin too — so this moves the Dart
  # package without moving the native SDK. 4.13.0 jumps to 12.17.0 and would
  # strand the rest of the set.
  #
  # Lift this bound only together with every other firebase_* package, and
  # check the new firebaseSdkVersion matches across all of them.
  firebase_core: '>=4.12.1 <4.13.0'
  # Pinned exactly, and not imported anywhere — it is here only to hold a
  # transitive package back.
  #
  # firebase_core 4.12.1 declares `firebase_core_platform_interface: ^8.0.0`,
  # which is too loose for its own iOS code. 4.11.0 added `recaptchaSiteKey`
  # as the 15th field of FirebaseOptions on both sides; 8.1.0 then *removed*
  # it from the Dart side (14 fields) ahead of the Swift native rewrite that
  # only ships in firebase_core 4.14.0. So Dart 8.1.1 sends 14 fields while
  # the ObjC `+[CoreFirebaseOptions fromList:]` in 4.12.1 still reads index
  # 14, and Firebase.initializeApp() aborts on iOS/macOS with
  # NSRangeException "index 14 beyond bounds [0 .. 13]". Android reads 13 and
  # is unaffected, which is why this only ever showed up on iOS.
  #
  # 8.0.0 still sends 15 fields, matching 4.12.1's native code. Every
  # firebase_* plugin here accepts ^8.0.0, so nothing else moves.
  #
  # Deliberately a real dependency rather than a dependency_overrides entry:
  # pub must keep *checking* this. firebase_core 4.14.0+ requires ^8.1.1, so
  # this pin will fail resolution loudly when the set is upgraded. An
  # override would instead force 8.0.0 silently onto 4.14.0's Swift code and
  # reproduce the same crash in the opposite direction.
  #
  # Remove this pin in the same change that moves firebase_core to 4.14.0+.
  firebase_core_platform_interface: 8.0.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  shared_preferences: ^2.2.3
  google_sign_in: ^7.2.0
  curved_navigation_bar: ^1.0.6
  shimmer: ^3.0.0
  image_picker: ^1.1.2
  firebase_storage: ^13.4.3
  geocoding: ^4.0.0
  geolocator: ^14.0.3
  flutter_rating_bar: ^4.0.1
  flutter_staggered_grid_view: ^0.7.0
  photo_view: ^0.15.0
  permission_handler: ^11.3.1
  share_plus: ^13.1.0
  url_launcher: ^6.3.0
  intl: ^0.20.0
  http: ^1.6.0
  flutter_dotenv: ^5.2.1

  # Exact, not a caret range: 6.5.5 is the only release that pins
  # firebase-ios-sdk 12.15.0, the version the rest of the firebase_* set
  # above pins. 6.5.6 moves to 12.17.0, 6.6.0 to 12.18.0 and 6.7.x to
  # 12.19.x, and any of those makes the Swift package graph unresolvable
  # until the whole set moves with it. See the firebase_core note above.
  firebase_remote_config: 6.5.5
  # Already resolved at 10.1.0 as a transitive dependency of share_plus;
  # declared here because the update check reads it directly.
  package_info_plus: ^10.1.0




dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/event-master.png"

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^3.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - .env
    - assets/images/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: JacquesFracois
      fonts:
        - asset: assets/fonts/JacquesFrancois-Regular.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
